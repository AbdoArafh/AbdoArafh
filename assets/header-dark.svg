<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
  <title id="title">Abdurrahman Salah, Frontend Engineer</title>
  <desc id="desc">A taped paper note introducing Abdurrahman Salah, a frontend engineer who builds and leads React and Next.js products, with a sticky note saying he is currently at Roon Studio and DataAnnotation.</desc>
  <defs>
    <clipPath id="desk"><rect width="860" height="330" rx="16"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="liftSm" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.49"/>
    </filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#ffa01f"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#desk)">
    <rect width="860" height="330" fill="#0a1820"/>
    <g stroke="#13303e" stroke-width="1"><line x1="0" y1="26" x2="860" y2="26"/><line x1="0" y1="52" x2="860" y2="52"/><line x1="0" y1="78" x2="860" y2="78"/><line x1="0" y1="104" x2="860" y2="104"/><line x1="0" y1="130" x2="860" y2="130"/><line x1="0" y1="156" x2="860" y2="156"/><line x1="0" y1="182" x2="860" y2="182"/><line x1="0" y1="208" x2="860" y2="208"/><line x1="0" y1="234" x2="860" y2="234"/><line x1="0" y1="260" x2="860" y2="260"/><line x1="0" y1="286" x2="860" y2="286"/><line x1="0" y1="312" x2="860" y2="312"/></g>
  </g>

  <!-- paper card -->
  <rect x="30" y="42" width="800" height="256" rx="6" fill="#0e2531" stroke="#215266" filter="url(#lift)"/>

  <!-- tape holding the card -->
  <g transform="rotate(-2 365 44)">
    <path d="M 304 27 L 426 27 L 430 32.666666666666664 L 426 38.333333333333336 L 430 44 L 426 49.66666666666667 L 430 55.333333333333336 L 426 61 L 304 61 L 300 55.333333333333336 L 304 49.66666666666667 L 300 44 L 304 38.333333333333336 L 300 32.666666666666664 L 304 27 Z" fill="#ffcf5a" fill-opacity="0.92"/>
  <path d="M 310 33 H 420 M 310 55 H 420" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <text x="70" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" letter-spacing="5" fill="#7fb3cb">HI, I'M</text>
  <text x="68" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="60" font-weight="800" fill="url(#name)" textLength="524" lengthAdjust="spacingAndGlyphs">Abdurrahman Salah</text>

  <text font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="19" fill="#eaf6fc">
    <tspan x="70" y="190">I build and lead the frontend of products</tspan>
    <tspan x="70" y="215">that hold up at scale.</tspan>
  </text>

  <g transform="translate(70 236)">
    <rect width="176" height="34" rx="17" fill="#133749" stroke="#215266"/>
    <circle cx="19" cy="17" r="4" fill="#ffb703"/>
    <text x="34" y="22" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#eaf6fc" textLength="122" lengthAdjust="spacingAndGlyphs">Frontend Engineer</text>
  </g>
  <g transform="translate(256 236)">
    <rect width="150" height="34" rx="17" fill="#133749" stroke="#215266"/>
    <circle cx="19" cy="17" r="4" fill="#8ecae6"/>
    <text x="34" y="22" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#eaf6fc" textLength="96" lengthAdjust="spacingAndGlyphs">React / Next.js</text>
  </g>
  <g transform="translate(416 236)">
    <rect width="118" height="34" rx="17" fill="#133749" stroke="#215266"/>
    <circle cx="19" cy="17" r="4" fill="#ffb703"/>
    <text x="34" y="22" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#eaf6fc" textLength="64" lengthAdjust="spacingAndGlyphs">SaaS &amp; AI</text>
  </g>

  <!-- sticky note: what is happening now -->
  <g transform="translate(644 90) rotate(3)">
    <rect width="178" height="168" rx="3" fill="#ffb703" filter="url(#liftSm)"/>
    <g transform="translate(58 -12) rotate(-3)"><path d="M 4 0 L 60 0 L 64 3.6666666666666665 L 60 7.333333333333333 L 64 11 L 60 14.666666666666666 L 64 18.333333333333332 L 60 22 L 4 22 L 0 18.333333333333332 L 4 14.666666666666666 L 0 11 L 4 7.333333333333333 L 0 3.6666666666666665 L 4 0 Z" fill="#ffcf5a" fill-opacity="0.7"/>
  <path d="M 10 6 H 54 M 10 16 H 54" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/></g>
    <text x="18" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#023047" fill-opacity=".65">RIGHT NOW</text>
    <text x="18" y="68" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="19" font-weight="800" fill="#023047">Roon Studio</text>
    <text font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="13.5" fill="#023047">
      <tspan x="18" y="88">Frontend engineer</tspan>
    </text>
    <line x1="18" y1="110" x2="160" y2="110" stroke="#023047" stroke-opacity=".3" stroke-dasharray="3 5" stroke-linecap="round"/>
    <text x="18" y="134" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="16" font-weight="800" fill="#023047">DataAnnotation</text>
    <text x="18" y="151" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif" font-size="13.5" fill="#023047">AI model evaluator</text>
  </g>
</svg>
